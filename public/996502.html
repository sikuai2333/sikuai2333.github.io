<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>996 → 502</title>
  <script>p5.disableFriendlyErrors = true;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
// === 996 → 502 ===
// 极简风格：一个大显示器 + 代码流 + 日夜循环 + 502弹出

const LOOP_FRAMES = 1800; // 30s循环
const LINE_W = 2.5;

// === 色板 ===
const C = {
  bgDay:    [135, 180, 220],
  bgNight:  [15, 15, 35],
  bgDawn:   [255, 200, 150],
  bgDusk:   [255, 140, 100],
  screen:   '#0d1117',
  code:     '#58e878',
  errorRed: '#ff4444',
  lamp:     '#ffe8a0',
  lampBody: '#555',
  coffee:   '#8b5e3c',
  monitor:  '#2a2a2a',
  monitorB: '#444',
  line:     '#e0e0e0',
}

// === 状态 ===
let errorPopup = { active: false, alpha: 0 }
let screenFlash = 0

function setup() {
  createCanvas(windowWidth, windowHeight)
  pixelDensity(1)
  frameRate(60)
  textFont('monospace')
}

function draw() {
  let t = frameCount % LOOP_FRAMES
  let progress = t / LOOP_FRAMES
  let hour = progress * 24

  // 502时抖动
  let sx = 0, sy = 0
  if (errorPopup.active && errorPopup.alpha > 150) {
    sx = random(-2, 2)
    sy = random(-1.5, 1.5)
  }

  push()
  translate(sx, sy)

  // 日夜背景
  drawBackground(hour)

  // 主显示器（居中，大）
  drawMainMonitor(progress)

  // 底部时钟
  drawTimeDisplay(hour)

  // 502弹窗
  updateAndDrawError(progress)

  // 屏幕闪烁
  drawScreenFlash()

  pop()
}

// === 日夜背景 ===
function drawBackground(hour) {
  let bg
  if (hour < 5) bg = C.bgNight
  else if (hour < 7) bg = lerp3(C.bgNight, C.bgDawn, (hour - 5) / 2)
  else if (hour < 9) bg = lerp3(C.bgDawn, C.bgDay, (hour - 7) / 2)
  else if (hour < 17) bg = C.bgDay
  else if (hour < 19) bg = lerp3(C.bgDay, C.bgDusk, (hour - 17) / 2)
  else if (hour < 21) bg = lerp3(C.bgDusk, C.bgNight, (hour - 19) / 2)
  else bg = C.bgNight

  background(bg[0], bg[1], bg[2])

  // 深夜时屏幕光晕
  if (hour < 6 || hour > 20) {
    noStroke()
    for (let r = 300; r > 0; r -= 20) {
      fill(80, 255, 120, 3 * (r / 300))
      ellipse(width / 2, height / 2, r, r * 0.6)
    }
  }
}

// === 主显示器 ===
function drawMainMonitor(progress) {
  let mw = width * 0.7
  let mh = height * 0.65
  let mx = (width - mw) / 2
  let my = height * 0.08

  // 显示器支架
  stroke(C.line)
  strokeWeight(LINE_W)
  fill(C.monitorB)
  rect(mx + mw / 2 - 10, my + mh, 20, height * 0.06, 2)
  rect(mx + mw / 2 - 30, my + mh + height * 0.05, 60, 8, 4)

  // 边框
  fill(C.monitor)
  stroke(C.line)
  strokeWeight(LINE_W)
  rect(mx, my, mw, mh, 8)

  // 屏幕
  noStroke()
  fill(C.screen)
  rect(mx + 10, my + 10, mw - 20, mh - 20, 4)

  // 内容
  let isCoding = progress < 0.78

  if (isCoding) {
    drawCodeOnScreen(mx + 15, my + 15, mw - 30, mh - 30)
  } else {
    draw502OnScreen(mx + 15, my + 15, mw - 30, mh - 30, (progress - 0.78) / 0.22)
  }

  // 电源灯
  let led = isCoding ? color(0, 255, 80) : color(255, 50, 50)
  fill(led)
  noStroke()
  ellipse(mx + mw / 2, my + mh + 10, 6, 6)
}

// === 代码流 ===
function drawCodeOnScreen(x, y, w, h) {
  let lines = [
    'function work() {',
    '  while(true) {',
    '    code();',
    '    if (tired) coffee();',
    '    // no break allowed',
    '  }',
    '}',
    'async function deploy() {',
    '  let res = await fetch(url);',
    '  if (res.status === 502) {',
    '    showError("Bad Gateway");',
    '    retry();',
    '  }',
    '}',
    'for (let i = 0; i < 996; i++) {',
    '  work(i); // 996循环',
    '}',
    'export default { work, deploy };',
  ]

  let scroll = (frameCount * 0.4) % (lines.length * 16)
  textAlign(LEFT, TOP)
  textSize(12)

  for (let i = 0; i < lines.length; i++) {
    let ly = y + i * 16 - scroll
    if (ly < y - 16 || ly > y + h) continue

    let line = lines[i]
    for (let j = 0; j < line.length; j++) {
      let cx = x + j * 9
      if (cx > x + w) break
      let ch = line[j]

      if (ch === '/' && line[j + 1] === '/') fill('#6a9955')
      else if ('{}();'.includes(ch)) fill('#d4d4d4')
      else if (ch >= '0' && ch <= '9') fill('#b5cea8')
      else if (ch === '"' || ch === "'") fill('#ce9178')
      else fill('#9cdcfe')

      text(ch, cx, ly)
    }
  }

  // 光标
  if (frameCount % 60 < 30) {
    fill(C.code)
    rect(x + 90, y + h - 20, 8, 14)
  }
}

// === 502屏幕 ===
function draw502OnScreen(x, y, w, h, t) {
  t = constrain(t, 0, 1)

  noStroke()
  fill(40, 5, 5, t * 200)
  rect(x, y, w, h)

  textAlign(CENTER, CENTER)
  textSize(min(w * 0.15, 80))
  fill(255, 60, 60, t * 255)
  text('502', x + w / 2, y + h / 2 - 20)

  textSize(min(w * 0.04, 20))
  fill(255, 100, 100, t * 200)
  text('Bad Gateway', x + w / 2, y + h / 2 + 30)

  if (t > 0.3 && frameCount % 25 < 3) screenFlash = 60
}

// === 底部时间 ===
function drawTimeDisplay(hour) {
  let hh = floor(hour)
  let mm = floor((hour - hh) * 60)
  let timeStr = nf(hh, 2) + ':' + nf(mm, 2)

  textAlign(CENTER, CENTER)
  textSize(18)
  fill(0, 0, 0, 150)
  rectMode(CENTER)
  rect(width / 2, height - 30, 120, 30, 8)
  rectMode(CORNER)

  fill(hh >= 9 && hh < 21 ? '#fff' : '#ffaa66')
  text(timeStr, width / 2, height - 30)
}

// === 502弹窗 ===
function updateAndDrawError(progress) {
  if (progress > 0.78 && progress < 0.98 && !errorPopup.active) {
    errorPopup.active = true
    errorPopup.alpha = 0
    screenFlash = 120
  }
  if (errorPopup.active) {
    if (progress < 0.92) errorPopup.alpha = min(errorPopup.alpha + 6, 255)
    else errorPopup.alpha = max(errorPopup.alpha - 8, 0)
  }
  if (progress < 0.1) { errorPopup.active = false; errorPopup.alpha = 0 }

  if (!errorPopup.active || errorPopup.alpha < 5) return

  let a = errorPopup.alpha
  let pw = 280, ph = 120
  let px = width / 2, py = height * 0.35

  noStroke()
  fill(0, 0, 0, a * 0.3)
  rect(px - pw / 2 + 3, py - ph / 2 + 3, pw, ph, 8)

  fill(35, 35, 40, a)
  stroke(255, 60, 60, a)
  strokeWeight(1.5)
  rect(px - pw / 2, py - ph / 2, pw, ph, 8)

  noStroke()
  fill(50, 15, 15, a)
  rect(px - pw / 2, py - ph / 2, pw, 28, 8, 8, 0, 0)

  textSize(12)
  textAlign(LEFT, CENTER)
  fill(255, 80, 80, a)
  text('⚠ 502 Bad Gateway', px - pw / 2 + 12, py - ph / 2 + 14)

  textAlign(CENTER, CENTER)
  textSize(13)
  fill(200, 200, 200, a)
  text('server is not responding', px, py + 5)

  fill(60, 60, 70, a)
  noStroke()
  rect(px - 30, py + ph / 2 - 35, 60, 25, 4)
  fill(255, 255, 255, a)
  textSize(12)
  text('OK', px, py + ph / 2 - 22)
}

// === 闪烁 ===
function drawScreenFlash() {
  if (screenFlash > 0) {
    noStroke()
    fill(255, 255, 255, screenFlash)
    rect(0, 0, width, height)
    screenFlash -= 8
  }
}

// === 工具 ===
function lerp3(a, b, t) {
  t = constrain(t, 0, 1)
  return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]
}

function windowResized() { resizeCanvas(windowWidth, windowHeight) }
</script>
</body>
</html>
