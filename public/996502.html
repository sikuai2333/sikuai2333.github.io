<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>996 → 502</title>
  <script>p5.disableFriendlyErrors = true;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
// === 996 → 502 ===
// 火柴人威利风格：纯黑线条圆头，黑白灰场景
// 只有显示器屏幕、咖啡、台灯等物体带颜色
// 24小时压缩为30秒循环，最终弹出502

const LOOP_FRAMES = 1800; // 30s @ 60fps
const LINE_W = 2.5;       // 统一线条粗细
const HEAD_R = 18;         // 头半径

// === 色板 ===
const C = {
  bg:       '#1a1a1a',
  floor:    '#222',
  wall:     '#1e1e1e',
  wallLine: '#2a2a2a',
  // 物体色（彩色）
  screen:   '#0d1117',
  code:     '#58e878',
  errorRed: '#ff4444',
  lamp:     '#ffe8a0',
  lampBody: '#555',
  coffee:   '#8b5e3c',
  steam:    'rgba(255,255,255,0.15)',
  desk:     '#3a3a3a',
  deskEdge: '#4a4a4a',
  monitor:  '#2a2a2a',
  monitorB: '#444',
  // 人（纯黑白）
  line:     '#e0e0e0',
  lineDark: '#aaa',
  shadow:   'rgba(0,0,0,0.3)',
}

// === 状态 ===
let errorPopup = { active: false, alpha: 0 }
let screenFlash = 0

function setup() {
  createCanvas(windowWidth, windowHeight)
  pixelDensity(1)
  frameRate(60)
  textFont('monospace')
}

function draw() {
  let t = frameCount % LOOP_FRAMES
  let progress = t / LOOP_FRAMES
  let hour = progress * 24

  // 抖动
  let sx = 0, sy = 0
  if (errorPopup.active && errorPopup.alpha > 150) {
    sx = random(-2, 2)
    sy = random(-1.5, 1.5)
  }

  push()
  translate(sx, sy)

  background(C.bg)

  drawRoom(hour)
  drawWindow(hour)
  drawDesk()
  drawLamp(hour)
  drawMonitor(progress)
  drawCoffee()
  drawStickman(progress)
  drawClock(hour)
  updateAndDrawError(progress)
  drawScreenFlash()

  pop()
}

// === 房间 ===
function drawRoom(hour) {
  // 墙
  noStroke()
  fill(C.wall)
  rect(0, 0, width, height * 0.7)

  // 墙面纹理线
  stroke(C.wallLine)
  strokeWeight(0.5)
  for (let y = 0; y < height * 0.7; y += 40) {
    line(0, y, width, y)
  }

  // 地板
  fill(C.floor)
  noStroke()
  rect(0, height * 0.7, width, height * 0.3)

  // 地板线条
  stroke('#2a2a2a')
  strokeWeight(0.5)
  for (let x = 0; x < width; x += 60) {
    line(x, height * 0.7, x, height)
  }
}

// === 窗户 ===
function drawWindow(hour) {
  let wx = width * 0.78
  let wy = height * 0.1
  let ww = width * 0.12
  let wh = height * 0.35

  // 天空色
  let sky
  if (hour < 6) sky = [10, 10, 35]
  else if (hour < 8) sky = lerp3([10, 10, 35], [180, 160, 120], (hour - 6) / 2)
  else if (hour < 17) sky = [140, 180, 220]
  else if (hour < 19) sky = lerp3([140, 180, 220], [200, 120, 80], (hour - 17) / 2)
  else sky = lerp3([200, 120, 80], [10, 10, 35], min((hour - 19) / 2, 1))

  // 窗框
  stroke(C.line)
  strokeWeight(LINE_W)
  noFill()
  rect(wx, wy, ww, wh)

  // 玻璃
  fill(sky[0], sky[1], sky[2])
  noStroke()
  rect(wx + 2, wy + 2, ww - 4, wh - 4)

  // 十字窗格
  stroke(C.line)
  strokeWeight(LINE_W)
  line(wx + ww / 2, wy, wx + ww / 2, wy + wh)
  line(wx, wy + wh / 2, wx + ww, wy + wh / 2)

  // 星星
  if (hour < 6 || hour > 20) {
    fill(255, 255, 200)
    noStroke()
    let seeds = [[0.3, 0.2], [0.7, 0.4], [0.5, 0.15], [0.2, 0.6]]
    for (let s of seeds) {
      let tw = sin(frameCount * 0.04 + s[0] * 20) * 0.5 + 0.5
      fill(255, 255, 200, tw * 200)
      ellipse(wx + ww * s[0], wy + wh * s[1], 2)
    }
  }
}

// === 桌子 ===
function drawDesk() {
  let dy = height * 0.68
  // 桌面
  stroke(C.line)
  strokeWeight(LINE_W)
  fill(C.desk)
  rect(width * 0.15, dy, width * 0.6, height * 0.04, 2)
  // 桌腿
  stroke(C.line)
  strokeWeight(LINE_W)
  line(width * 0.18, dy + height * 0.04, width * 0.18, height * 0.92)
  line(width * 0.72, dy + height * 0.04, width * 0.72, height * 0.92)
  // 横档
  line(width * 0.18, height * 0.82, width * 0.72, height * 0.82)
}

// === 台灯 ===
function drawLamp(hour) {
  let lx = width * 0.22
  let ly = height * 0.68

  // 灯光晕（夜间）
  if (hour < 7 || hour > 18) {
    noStroke()
    for (let r = 120; r > 0; r -= 15) {
      fill(255, 235, 180, 6 * (r / 120))
      ellipse(lx, ly - 10, r, r * 0.5)
    }
  }

  stroke(C.line)
  strokeWeight(LINE_W)

  // 灯座
  fill(C.lampBody)
  rect(lx - 12, ly - 3, 24, 5, 2)

  // 灯杆
  line(lx, ly - 3, lx, ly - 50)

  // 灯臂
  line(lx, ly - 50, lx - 15, ly - 75)

  // 灯罩（三角形）
  fill(C.lampBody)
  triangle(lx - 30, ly - 70, lx, ly - 70, lx - 15, ly - 82)

  // 灯泡光点
  fill(C.lamp)
  noStroke()
  ellipse(lx - 15, ly - 72, 5, 4)
}

// === 显示器 ===
function drawMonitor(progress) {
  let mx = width * 0.32
  let my = height * 0.22
  let mw = width * 0.3
  let mh = height * 0.4

  // 支架
  stroke(C.line)
  strokeWeight(LINE_W)
  fill(C.monitorB)
  rect(mx + mw / 2 - 6, my + mh, 12, height * 0.05, 1)
  rect(mx + mw / 2 - 20, my + mh + height * 0.04, 40, 4, 2)

  // 边框
  fill(C.monitor)
  stroke(C.line)
  strokeWeight(LINE_W)
  rect(mx, my, mw, mh, 4)

  // 屏幕
  noStroke()
  fill(C.screen)
  rect(mx + 6, my + 6, mw - 12, mh - 12, 2)

  // 内容
  let isCoding = progress < 0.78

  if (isCoding) {
    drawCodeOnScreen(mx + 10, my + 10, mw - 20, mh - 20)
  } else {
    draw502OnScreen(mx + 10, my + 10, mw - 20, mh - 20, (progress - 0.78) / 0.22)
  }

  // 电源灯
  let led = isCoding ? color(0, 255, 80) : color(255, 50, 50)
  fill(led)
  noStroke()
  ellipse(mx + mw / 2, my + mh + 8, 4, 4)
}

// === 屏幕代码流 ===
function drawCodeOnScreen(x, y, w, h) {
  let lines = [
    'function work() {',
    '  while(true) {',
    '    code();',
    '    coffee();',
    '    if (tired) {',
    '      // no break',
    '    }',
    '  }',
    '}',
    'async function deploy() {',
    '  let res = await fetch(url);',
    '  if (res.status === 502) {',
    '    crash();',
    '  }',
    '}',
    '// TODO: sleep',
    'for (let i = 0; i < 996; i++) {',
    '  work(i);',
    '}',
    'export default pain;',
  ]

  let scroll = (frameCount * 0.4) % (lines.length * 16)
  textAlign(LEFT, TOP)
  textSize(11)

  for (let i = 0; i < lines.length; i++) {
    let ly = y + i * 16 - scroll
    if (ly < y - 16 || ly > y + h) continue

    let line = lines[i]
    for (let j = 0; j < line.length; j++) {
      let cx = x + j * 8
      if (cx > x + w) break
      let ch = line[j]

      if (ch === '/' && line[j + 1] === '/') {
        fill('#6a9955')
      } else if ('{}();'.includes(ch)) {
        fill('#d4d4d4')
      } else if (ch >= '0' && ch <= '9') {
        fill('#b5cea8')
      } else if (ch === '"' || ch === "'") {
        fill('#ce9178')
      } else if (ly > y + h - 30 && j < 8) {
        fill(C.code)
      } else {
        fill('#9cdcfe')
      }
      text(ch, cx, ly)
    }
  }

  // 光标
  if (frameCount % 60 < 30) {
    fill(C.code)
    let cursorX = x + (sin(frameCount * 0.08) * 40 + 80)
    let cursorY = y + h - 22
    rect(cursorX, cursorY, 7, 13)
  }
}

// === 502 屏幕 ===
function draw502OnScreen(x, y, w, h, t) {
  t = constrain(t, 0, 1)

  // 红色渐入
  noStroke()
  fill(40, 5, 5, t * 200)
  rect(x, y, w, h)

  // 502 大字
  textAlign(CENTER, CENTER)
  textSize(min(w * 0.22, 55))
  fill(255, 60, 60, t * 255)
  text('502', x + w / 2, y + h / 2 - 15)

  textSize(min(w * 0.07, 14))
  fill(255, 100, 100, t * 200)
  text('Bad Gateway', x + w / 2, y + h / 2 + 20)

  // 屏幕闪烁
  if (t > 0.3 && frameCount % 25 < 3) {
    screenFlash = 60
  }
}

// === 咖啡杯 ===
function drawCoffee() {
  let cx = width * 0.7
  let cy = height * 0.64

  stroke(C.line)
  strokeWeight(LINE_W)

  // 杯身
  fill(C.coffee)
  rect(cx - 10, cy - 8, 20, 18, 0, 0, 3, 3)

  // 液面
  fill('#6b4226')
  ellipse(cx, cy - 8, 20, 6)

  // 把手
  noFill()
  stroke(C.line)
  strokeWeight(LINE_W)
  arc(cx + 13, cy, 10, 14, -HALF_PI, HALF_PI)

  // 蒸汽
  noFill()
  strokeWeight(1)
  for (let i = 0; i < 3; i++) {
    let phase = (frameCount * 0.015 + i * 1.2) % 3
    let sy = cy - 12 - phase * 18
    let a = (1 - phase / 3) * 40
    stroke(255, 255, 255, a)
    let sx = cx - 4 + i * 4 + sin(frameCount * 0.025 + i) * 2
    bezier(sx, sy, sx - 2, sy - 6, sx + 2, sy - 12, sx, sy - 18)
  }
}

// === 火柴人（威利风格）===
function drawStickman(progress) {
  let bx = width * 0.47
  let by = height * 0.55

  let breathe = sin(frameCount * 0.025) * 1.5
  let typeWobble = sin(frameCount * 0.12) * 2

  // 502瘫倒
  let slump = 0
  if (progress > 0.78) {
    slump = easeInQuad(constrain((progress - 0.78) / 0.22, 0, 1)) * 20
  }

  push()
  translate(bx, by + slump)

  stroke(C.line)
  strokeWeight(LINE_W)
  noFill()

  // === 头（圆圈）===
  ellipse(0, -70 + breathe, HEAD_R * 2, HEAD_R * 2)

  // 头发（背面看：后脑勺几根线）
  stroke(C.line)
  strokeWeight(1.5)
  let hr = HEAD_R
  for (let i = -2; i <= 2; i++) {
    let angle = -HALF_PI + i * 0.3
    let x1 = cos(angle) * hr
    let y1 = sin(angle) * hr - 70 + breathe
    let x2 = cos(angle) * (hr + 6)
    let y2 = sin(angle) * (hr + 6) - 70 + breathe
    line(x1, y1, x2, y2)
  }

  // === 脖子 ===
  stroke(C.line)
  strokeWeight(LINE_W)
  line(0, -52 + breathe, 0, -40 + breathe)

  // === 躯干 ===
  line(0, -40 + breathe, 0, 10 + breathe)

  // === 手臂（打字动画）===
  let armY = -25 + breathe
  let handLY = 30 + breathe + typeWobble
  let handRY = 30 + breathe - typeWobble

  // 左臂：肩→肘→手
  let lElbowX = -20
  let lElbowY = armY + 10 + typeWobble * 0.5
  line(0, armY, lElbowX, lElbowY)
  line(lElbowX, lElbowY, -15, handLY)

  // 右臂
  let rElbowX = 20
  let rElbowY = armY + 10 - typeWobble * 0.5
  line(0, armY, rElbowX, rElbowY)
  line(rElbowX, rElbowY, 15, handRY)

  // 手（小圆）
  fill(C.line)
  noStroke()
  ellipse(-15, handLY, 5, 5)
  ellipse(15, handRY, 5, 5)

  // === 腿 ===
  stroke(C.line)
  strokeWeight(LINE_W)
  noFill()
  // 左腿
  let kneeY = 35 + breathe
  line(0, 10 + breathe, -15, kneeY)
  line(-15, kneeY, -12, 65 + breathe)
  // 右腿
  line(0, 10 + breathe, 15, kneeY)
  line(15, kneeY, 12, 65 + breathe)

  // 脚（小横线）
  line(-12, 65 + breathe, -20, 65 + breathe)
  line(12, 65 + breathe, 20, 65 + breathe)

  pop()
}

// === 时钟 ===
function drawClock(hour) {
  let hh = floor(hour)
  let mm = floor((hour - hh) * 60)
  let ss = floor(((hour - hh) * 60 - mm) * 60)
  let timeStr = nf(hh, 2) + ':' + nf(mm, 2) + ':' + nf(ss, 2)

  // 背景
  noStroke()
  fill(0, 0, 0, 150)
  rectMode(CENTER)
  rect(width / 2, 28, 180, 32, 6)
  rectMode(CORNER)

  // 时间
  textAlign(CENTER, CENTER)
  textSize(16)
  fill(hh >= 9 && hh < 21 ? '#fff' : '#ffaa66')
  text(timeStr, width / 2, 26)

  // 标题
  textSize(10)
  fill(255, 255, 255, 60)
  text('9 9 6  →  5 0 2', width / 2, 50)
}

// === 502 弹窗 ===
function updateAndDrawError(progress) {
  if (progress > 0.78 && progress < 0.98 && !errorPopup.active) {
    errorPopup.active = true
    errorPopup.alpha = 0
    screenFlash = 120
  }
  if (errorPopup.active) {
    if (progress < 0.92) errorPopup.alpha = min(errorPopup.alpha + 6, 255)
    else errorPopup.alpha = max(errorPopup.alpha - 8, 0)
  }
  if (progress < 0.1) { errorPopup.active = false; errorPopup.alpha = 0 }

  if (!errorPopup.active || errorPopup.alpha < 5) return

  let a = errorPopup.alpha
  let pw = 240, ph = 100
  let px = width / 2, py = height * 0.35

  // 阴影
  noStroke()
  fill(0, 0, 0, a * 0.3)
  rect(px - pw / 2 + 3, py - ph / 2 + 3, pw, ph, 6)

  // 弹窗
  fill(35, 35, 40, a)
  stroke(C.errorRed + hex(floor(a), 2).slice(-2))
  strokeWeight(1.5)
  rect(px - pw / 2, py - ph / 2, pw, ph, 6)

  // 标题栏
  noStroke()
  fill(50, 15, 15, a)
  rect(px - pw / 2, py - ph / 2, pw, 24, 6, 6, 0, 0)

  textSize(11)
  textAlign(LEFT, CENTER)
  fill(255, 80, 80, a)
  text('⚠ 502 Bad Gateway', px - pw / 2 + 10, py - ph / 2 + 12)

  // 内容
  textAlign(CENTER, CENTER)
  textSize(12)
  fill(200, 200, 200, a)
  text('server is not responding', px, py + 5)

  // OK 按钮
  fill(60, 60, 70, a)
  noStroke()
  rect(px - 25, py + ph / 2 - 30, 50, 20, 3)
  fill(255, 255, 255, a)
  textSize(11)
  text('OK', px, py + ph / 2 - 20)
}

// === 屏幕闪烁 ===
function drawScreenFlash() {
  if (screenFlash > 0) {
    noStroke()
    fill(255, 255, 255, screenFlash)
    rect(0, 0, width, height)
    screenFlash -= 8
  }
}

// === 工具 ===
function lerp3(a, b, t) {
  t = constrain(t, 0, 1)
  return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]
}
function easeInQuad(t) { return t * t }

function windowResized() { resizeCanvas(windowWidth, windowHeight) }
</script>
</body>
</html>
